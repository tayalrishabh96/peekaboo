# Do NOT commit a real kubeconfig. This is a template.
#
# The preferred way to create this Secret is straight from your restricted
# kubeconfig file (keeps the token out of source control):
#
#   kubectl create secret generic kube-forwarder-kubeconfig \
#     --from-file=config=/path/to/restricted-kubeconfig \
#     --namespace <where-you-deploy-kube-forwarder>
#
# The kubeconfig you mount should:
#   * point at the cluster API reachable from this pod (e.g. via cd.example.com)
#   * use the restricted token (View on namespaces devtroncd + monitoring)
#   * have its current-context / contexts set so the app can select them
#
# If you'd rather manage it declaratively, base64-encode the file and paste it:
#
#   base64 -i /path/to/restricted-kubeconfig | tr -d '\n'
#
apiVersion: v1
kind: Secret
metadata:
  name: kube-forwarder-kubeconfig
type: Opaque
data:
  config: <BASE64_ENCODED_KUBECONFIG>
