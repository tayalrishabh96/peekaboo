apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-forwarder
  labels:
    app: kube-forwarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-forwarder
  template:
    metadata:
      labels:
        app: kube-forwarder
    spec:
      containers:
        - name: kube-forwarder
          # Replace with your pushed image ref.
          image: REGISTRY/kube-forwarder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8770
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8770"
            # Reverse-proxy to services through each context's API server, so
            # browser traffic returns through this one HTTP port (works behind
            # the ingress) and reaches any cluster the kubeconfig can talk to.
            - name: FORWARD_MODE
              value: "proxy"
            # Services matching these glob patterns (comma-separated, matched
            # against "service" or "namespace/service") are reached via a
            # port-forward tunnel instead of the API server — needed for apps
            # that use write methods (e.g. Grafana login POST), which the
            # service-proxy path can't do without Admin RBAC.
            - name: TUNNEL_SERVICES
              value: "*grafana*"
            # Enables subdomain routing: each service opens at
            # ‹slug›.BASE_DOMAIN, served over a tunnel with its native path
            # preserved (so SPAs like Grafana work without response rewriting).
            # Requires wildcard DNS + TLS for *.BASE_DOMAIN.
            - name: BASE_DOMAIN
              value: "kube-forwarder.devtron.ai"
            - name: KUBECONFIG
              value: "/etc/kube/config"
            # Curated UI-service list (ConfigMap). Remove to show all services.
            - name: SERVICE_CONFIG
              value: "/etc/peekaboo/services.json"
            # kubectl writes discovery/HTTP cache under $HOME; point it at a
            # writable emptyDir since the root filesystem is read-only.
            - name: HOME
              value: "/tmp"
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kube
              readOnly: true
            - name: services
              mountPath: /etc/peekaboo
              readOnly: true
            - name: cache
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/contexts
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: kubeconfig
          secret:
            secretName: kube-forwarder-kubeconfig
            items:
              - key: config
                path: config
        - name: services
          configMap:
            name: kube-forwarder-services
            items:
              - key: services.json
                path: services.json
        - name: cache
          emptyDir: {}
