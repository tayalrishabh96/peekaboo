apiVersion: v1
kind: Service
metadata:
  name: kube-forwarder
  labels:
    app: kube-forwarder
spec:
  # ClusterIP only — reachable inside the cluster network, not exposed publicly.
  type: ClusterIP
  selector:
    app: kube-forwarder
  ports:
    - name: http
      port: 80
      targetPort: http
